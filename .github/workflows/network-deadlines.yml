name: Network semantics

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  network-semantics:
    name: Runtime semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./internal/vm -run 'Test.*(Network|Net|Socket|Listener|Deadline|Timeout|Poll|Wake|WSA|PendingRead|PendingWrite|PendingAccept|BlockedWrite)' -count=1 -timeout=120s
      # The Go race detector supports the hosted linux/amd64 and windows/amd64 toolchains.
      # Package-wide on purpose (issue #86): the name filter used to skip the
      # test that exposed the ObjInstance data race, so it never ran under -race
      # in CI. ~30s locally.
      - run: go test -race ./internal/vm -count=1 -timeout=600s
      - run: go test ./internal/... -count=1
      - run: go test ./cmd/... -count=1
      - run: go test ./... -count=1
        working-directory: sdk/noxyplugin

  examples:
    name: Noxy examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # noxy_libs is derived (spec 2026-09-04): install the locked dependencies
      # first. Needs network for github.com/estevaofon/quicksort@v0.1.0 and the
      # noxy_dynamodb release assets; --locked fails if noxy.sum drifted.
      - run: go run ./cmd/noxy --sync --locked
      # run_all_tests_concurrent.nx runs every noxy_examples/*.nx (minus the
      # interactive/server demos in its exclusion list) through argv[0] — the
      # interpreter `go run` just built — with 8 workers, and exits 1 if any
      # example fails. It lists the directory via `ls`/`dir` by OS, so it must
      # run from the repository root.
      - run: go run ./cmd/noxy noxy_examples/run_all_tests_concurrent.nx

  cross-build:
    name: Production cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Poller sources also compile for dragonfly/amd64, netbsd/amd64,
      # openbsd/amd64, solaris/amd64, and aix/ppc64. Full-repository builds
      # for those targets currently fail earlier in modernc SQLite/libc, so
      # they must not be presented as green production cross-build gates.
      - run: go build ./...
