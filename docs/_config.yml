# GitHub Pages configuration for noxylang.com
# Published from the `main` branch, folder /docs (see docs/README.md).

# Site settings
title: "Noxy"
description: "Noxy is a statically typed programming language with a stack-based VM written in Go: value semantics with copy-on-write, explicit sharing with ref, generics, closures, modules and Go-style concurrency."
url: "https://noxylang.com"
baseurl: ""
lang: "en"
author: "Estêvão Fonseca"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Every Markdown file in this folder is rendered as a page by GitHub Pages
# (jekyll-optional-front-matter is always on), so its text goes through Liquid.
# Literal `{{` / `{%` — the f-string escape rules in NOXY_LANGUAGE_SPEC.md —
# must be wrapped in `<!-- {% raw %} -->` … `<!-- {% endraw %} -->` HTML
# comments (invisible on GitHub, a no-op for kramdown), or the build fails
# with "Liquid syntax error ... was not properly terminated".
exclude:
  - README.md
  - SHOWCASE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - superpowers

# Social media
social:
  name: "Noxy"
  links:
    - "https://github.com/estevaofon/noxy"

# Logo
logo: "https://github.com/user-attachments/assets/8af825b7-fc42-4e0b-8aab-da9bba99b6e0"

# Theme color
theme_color: "#6366f1"
